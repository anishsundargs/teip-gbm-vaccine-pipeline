seed: 42
run_dir: runs

data:
  data_csv: data/example_training.csv
  batch_size: 32
  val_fraction: 0.2
  num_workers: 0
  max_pep: 11
  max_hla: 34

model:
  d_model: 128
  ctx_dim: 16
  dropout: 0.1
  learning_rate: 0.001
  weight_decay: 0.0001
  lam_presentation: 1.0
  lam_targetability: 1.0

trainer:
  accelerator: auto
  devices: auto
  max_epochs: 5
  log_every_n_steps: 5
